<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Main Video Player -->
    <main class="main">
        <div class="container">
            <div class="video-player-container">
                <video id="mainPlayer" class="video-player" controls>
                    <source src="" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
                
                <div class="video-overlay">
                    <div class="play-button" id="playButton">
                        <i class="fas fa-play"></i>
                    </div>
                </div>
            </div>
            
            <div class="video-info">
                <h1 class="video-title" id="videoTitle">Select a video to play</h1>
                <div class="video-meta">
                    <span class="views" id="videoViews">0 views</span>
                    <span class="upload-date" id="uploadDate">Today</span>
                </div>
            </div>
            
            <!-- Video List -->
            <div class="video-list-container">
                <h2>Videos</h2>
                <div class="video-list" id="videoList">
                    <!-- Video items will be populated by JavaScript -->
                </div>
            </div>
        </div>
    </main>

    <!-- Loading Spinner -->
    <div class="loading-spinner" id="loadingSpinner">
        <div class="spinner"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
